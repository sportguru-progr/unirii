<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program SG Unirii</title>
<meta name="theme-color" content="#5b0098">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Program Unirii">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{ --accent:#5b0098; --bg:#f4f5f7; --ink:#15181d; --muted:#6b7280; --card:#fff; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#14121a; --ink:#f2f0f5; --muted:#a39fae; --card:#1f1c27; } }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px}
  .card{background:var(--card);border-radius:20px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  img.logo{width:96px;height:96px;border-radius:22px}
  h1{font-size:22px;margin:16px 0 4px}
  p{color:var(--muted);margin:0 0 20px;font-size:15px;line-height:1.45}
  a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:15px;border-radius:14px}
  #hint{margin-top:22px;text-align:left;font-size:14px;color:var(--muted);line-height:1.5}
  #hint b{color:var(--ink)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Program SportGuru Unirii</h1>
  <p id="msg">Programul de lucru, pauzele de masă și concediile.</p>
  <a class="btn" id="deschide" href="#">Deschide programul</a>
  <div id="hint">
    <b>Pune iconița pe telefon:</b><br>
    <b>iPhone</b> (din Safari): butonul Partajare ⬆️ → „Adaugă pe ecranul principal”.<br>
    <b>Android</b> (din Chrome): meniul ⋮ → „Instalează aplicația” sau „Adaugă pe ecranul de pornire”.
  </div>
</div>
<script>
  // Linkul aplicației (Deploy → Manage deployments → Copiază). Se schimbă doar aici.
  var APLICATIE = 'https://script.google.com/macros/s/AKfycbw49d0cYlJ3cfkIN6dOEQb7TSK_b5lw1okFJd6lUDlFWPmH2TswMm8ySceoixegwqeq/exec';

  // păstrează ?nume=... dacă e în link (alege automat angajatul)
  var tinta = APLICATIE + (location.search || '');
  document.getElementById('deschide').href = tinta;

  // deschisă de pe iconița de pe ecran → intră direct în program
  var dePeEcran = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (dePeEcran) {
    document.getElementById('msg').textContent = 'Se deschide programul…';
    document.getElementById('hint').style.display = 'none';
    location.replace(tinta);
  }
</script>
</body>
</html>
